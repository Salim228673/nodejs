name: matrix in cicd

on:
  - push

jobs:
  matrix-job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16.18,20,24]
    steps:
      - name: Checkout karo Code ko
        uses: actions/checkout@v6.1.0

      - name: Use NodeJS Actions
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: check node version
        run: node -v
        
